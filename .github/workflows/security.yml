# DevSecOps pipeline: runs on every push and pull request.
# Each job is one security check; a red job blocks the merge.
name: CI and security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run pytest -v

  dependencies:
    name: Vulnerable libraries (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      - run: uv export --frozen --no-hashes --no-dev > requirements-locked.txt
      - run: uvx pip-audit --strict -r requirements-locked.txt

  code:
    name: Insecure code (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
      # -ll = fail on medium or high severity findings
      - run: uvx bandit -r app -ll

  secrets:
    name: Leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --verbose --redact

  container:
    name: Container image (Trivy) and live app scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t voiceops:ci .

      - name: Scan the Dockerfile for misconfigurations
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 config --exit-code 1 --severity HIGH,CRITICAL /src

      - name: Scan the image for vulnerable OS packages and libraries
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed voiceops:ci

      - name: Start the app (with a fake key; no Gemini calls are made)
        run: |
          docker run -d --name voiceops -p 8000:8000 -e GOOGLE_API_KEY=ci-fake-key voiceops:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/api/health && exit 0; sleep 2; done
          docker logs voiceops; exit 1

      - name: OWASP ZAP baseline scan (passive web checks)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.0 \
            zap-baseline.py -t http://localhost:8000 -r zap-report.html -I

      - name: Save the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap/zap-report.html
          if-no-files-found: ignore
